name: Build VirtualCam KSU module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第三方库用 checkout action 拉取（带 GITHUB_TOKEN），CMake 只读本地目录，
      # 不在子构建里做匿名 git clone。
      - name: Checkout ShadowHook source
        uses: actions/checkout@v4
        with:
          repository: bytedance/android-inline-hook
          path: third_party/shadowhook
          submodules: recursive

      - name: Inspect ShadowHook tree (diagnostics)
        run: |
          echo "== CMakeLists 位置 =="
          find third_party/shadowhook -name CMakeLists.txt | sort
          echo "== native 目录 =="
          ls third_party/shadowhook/shadowhook/src/main/cpp
          echo "== 架构目录 =="
          ls third_party/shadowhook/shadowhook/src/main/cpp/arch

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: "r26d", add-to-path: true }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with: { cmake-version: "3.30.x" }

      - name: Build arm64-v8a.so (Zygisk + ShadowHook)
        working-directory: zygisk
        run: |
          export ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          echo "== 构建产物 =="
          find build -maxdepth 1 -name '*.so' -ls
          SO=$(find build -maxdepth 1 \( -name 'arm64-v8a.so' -o -name 'libarm64-v8a.so' \) | head -1)
          test -n "$SO" || { echo "未产出 arm64-v8a.so"; exit 1; }
          cp "$SO" arm64-v8a.so
          # best-effort：确认导出了 Zygisk 入口符号，只警告不阻断打包
          NM="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          if [ -x "$NM" ]; then
            "$NM" -D arm64-v8a.so | grep -E "zygisk_init|zygisk_module_entry" \
              && echo "Zygisk entry OK" \
              || echo "WARNING: 未找到 Zygisk 入口符号，刷入后模块可能不加载"
          fi

      - name: Package flashable zip
        run: |
          mkdir -p dist/VirtualCamKSU/zygisk
          cp -r module.prop customize.sh service.sh post-fs-data.sh sepolicy.rule webroot dist/VirtualCamKSU/
          cp zygisk/arm64-v8a.so dist/VirtualCamKSU/zygisk/
          cd dist && zip -r ../VirtualCamKSU.zip VirtualCamKSU

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamKSU
          path: VirtualCamKSU.zip
